<!-- Floating Side Button -->
<div class="quick-note-toggle" onclick="toggleNoteSidebar()">
    <i class="fas fa-sticky-note"></i> Leave a Note
</div>

<!-- Side Drawer Panel -->
<div class="note-sidebar" id="noteSidebar">
    <div class="note-sidebar-header">
        <h3><i class="fas fa-pen-to-square"></i> Send Quick Note</h3>
        <button class="close-note-btn" onclick="toggleNoteSidebar()">&times;</button>
    </div>
    
    <!-- Direct Email Submission Form via Formspree -->
    <form action="https://formspree.io/f/rezaajaz111@gmail.com" method="POST">
        <div class="note-form-group">
            <label for="senderName">Your Name / Shop Name</label>
            <input type="text" id="senderName" name="name" placeholder="Enter your name" required>
        </div>
        <div class="note-form-group">
            <label for="senderPhone">Mobile Number</label>
            <input type="tel" id="senderPhone" name="phone" placeholder="Enter mobile number" required>
        </div>
        <div class="note-form-group">
            <label for="noteMessage">Your Note / Requirement</label>
            <textarea id="noteMessage" name="message" rows="5" placeholder="Write your note or requirement here..." required></textarea>
        </div>
        <button type="submit" class="btn-submit-note"><i class="fas fa-paper-plane"></i> Send to Email</button>
    </form>
</div>

<!-- JavaScript for Sidebar Toggle -->
<script>
    function toggleNoteSidebar() {
        const sidebar = document.getElementById('noteSidebar');
        sidebar.classList.toggle('active');
    }
</script>
